[package]
name = "iroh-spike-host-wasmtime"
version = "0.0.1"
edition.workspace = true
publish.workspace = true
description = "The Wasmtime host drivers as one multi-call binary (spike, endpoint-demo, exec-model)"

[[bin]]
name = "iroh-hosts"
path = "src/main.rs"

[dependencies]
# The `polymorph:webrtc-datachannels` host implementation (a real webrtc-rs peer
# connection behind the `connections` imports).
wasmtime-webrtc-datachannels = { path = "../.deps/webrtc/wasmtime-impl" }
# The `polymorph:webcrypto` host implementation (RustCrypto behind the crypto
# imports the guest's TLS layer uses).
polymorph-webcrypto-wasmtime = { path = "../.deps/webcrypto/rust/wasmtime" }
# The `polymorph:websocket` host implementation (tokio-tungstenite behind the
# relay connection the guest signals over).
wasmtime-websocket = { path = "../.deps/websocket/rust/wasmtime" }
wasmtime = { version = "47", features = ["component-model", "component-model-async", "async", "cranelift", "runtime"] }
wasmtime-wasi = { version = "47", features = ["p3"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time"] }
anyhow = "1"
clap = { version = "4", features = ["derive"] }
env_logger = "0.11"
