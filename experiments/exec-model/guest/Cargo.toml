[package]
name = "iroh-exec-model-guest"
version = "0.0.1"
edition.workspace = true
publish.workspace = true
description = "Execution-model probe guest: block_on-in-spawn and exported streams"

[lib]
crate-type = ["cdylib"]

[dependencies]
wit-bindgen = { version = "0.59", features = ["async", "async-spawn"] }
futures = { version = "0.3", default-features = false, features = ["async-await", "std"] }
polymorph-webcrypto-guest.workspace = true
hex = "0.4"
