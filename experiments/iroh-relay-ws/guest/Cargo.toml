[workspace]

[package]
name = "iroh-relay-ws-guest"
version = "0.0.1"
edition = "2021"
publish = false
description = "Spike: upstream iroh (v1.1.0 + wasi patches) on wasm32-wasip2 — relay over polymorph-websocket plus live migration onto WebRTC data channels via the synthetic-address overlay, all through the synthetic-datagram wake pattern"

[dependencies]
iroh = { git = "https://github.com/lannbot/iroh.git", rev = "b7895560883b2f9a1539843337f4deb9b976f1c3", default-features = false, features = ["tls-ring"] }
tokio = { version = "1.53", default-features = false, features = ["rt", "macros", "time", "sync", "io-util", "net"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# iroh and netwatch need wasi-enablement patches not (yet) upstream,
# carried on the lannbot forks rebased onto the released versions:
#
# - iroh fork = v1.1.0 plus the wasi patch branches merged — lann/iroh#1
#   (iroh-dns tolerates the missing system resolver config), #2 (relay
#   connect() over the datagram pipe), #3 (net_report skips probes no
#   wasi host can deliver). iroh's path deps pull the patched
#   iroh-relay and iroh-dns from the same checkout.
# - netwatch fork = netwatch-v0.19.3 (iroh 1.1.0 requires ^0.19.3) plus
#   the wasi patch branches merged — lann/net-tools#1 (wasi routes to
#   the netdev-free posix_minimal branch), #2 (sockets close inline on
#   drop; no spawn_blocking on wasi).
[patch.crates-io]
netwatch = { git = "https://github.com/lannbot/net-tools.git", rev = "17c98b368a42055da3f9e11be58f7f25382e5252" }

[profile.release]
lto = true
opt-level = "s"
