[workspace]

[package]
name = "ping-demo-guest"
version = "0.0.1"
edition = "2021"
publish = false
description = "Ping-demo guest: one upstream-iroh endpoint per page — frame ferry, stock iroh-blobs file transfer, and live migration onto a WebRTC data channel via the synthetic-address overlay"

[dependencies]
iroh = { version = "1.0", default-features = false, features = ["tls-ring"] }
iroh-blobs = { version = "0.103.0", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
n0-future = "0.3"
tokio = { version = "1.53", default-features = false, features = ["rt", "macros", "time", "sync", "io-util", "net"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Same wasi enablement patches as the iroh-relay-ws spike, from the
# lannbot/iroh and lannbot/net-tools `polymorph-iroh` branches (see that
# Cargo.toml for the full rationale). iroh-blobs depends on crates-io
# iroh, so the substitution happens on the crates-io side; the branch's
# path deps pull the patched iroh-relay and iroh-dns along, and
# iroh-base is patched to the same branch so iroh and iroh-blobs share
# one copy of its types.
[patch.crates-io]
iroh = { git = "https://github.com/lannbot/iroh.git", rev = "b7895560883b2f9a1539843337f4deb9b976f1c3" }
iroh-base = { git = "https://github.com/lannbot/iroh.git", rev = "b7895560883b2f9a1539843337f4deb9b976f1c3" }
netwatch = { git = "https://github.com/lannbot/net-tools.git", rev = "17c98b368a42055da3f9e11be58f7f25382e5252" }

[profile.release]
lto = true
opt-level = "s"
