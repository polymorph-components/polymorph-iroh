[package]
name = "iroh-peer"
version = "0.0.1"
edition.workspace = true
publish.workspace = true

[dependencies]
# The upstream implementation under test. The pin is co-pinned with the
# `iroh-relay` binary scripts/setup.sh installs — the two must move
# together.
iroh = "=1.0.3"

bytes = "1"
anyhow = "1"
hex = "0.4"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
