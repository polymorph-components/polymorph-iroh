# Publish @polymorph/iroh (host-polyengine) to JSR: build the endpoint
# component from this tree (against the .deps sibling checkouts
# scripts/setup.sh pins), embed it as the package's base64 asset module,
# and publish.
#
# Auth is GitHub Actions OIDC: the package's GitHub-repository link on
# jsr.io authorizes runs from this repository — no tokens. Dispatch after
# a release whose manifest version is not yet on JSR; JSR rejects
# duplicate versions, so a re-run is a no-op-by-failure. --allow-dirty is
# for the generated (gitignored) asset module only.
name: jsr-publish
on:
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - name: Install Rust toolchain
        # rust-toolchain.toml pins the version and wasm target.
        run: rustup show active-toolchain || rustup toolchain install
      - uses: denoland/setup-deno@v2
        with:
          deno-version: "2.9.5"
      - name: Install dependencies (.deps sibling checkouts)
        run: ./scripts/setup.sh
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Build and embed the endpoint component
        run: |
          cargo build -p iroh-endpoint --target wasm32-wasip2 --release
          deno run --allow-read=target --allow-write=host-polyengine/src/endpoint_component.ts scripts/embed-endpoint-component.ts
      - run: deno publish --allow-dirty
        working-directory: host-polyengine
