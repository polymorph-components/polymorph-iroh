[workspace]
resolver = "2"
members = ["core", "endpoint", "endpoint-demo", "host-wasmtime", "experiments/exec-model/guest", "tools/iroh-peer"]
# The native (host-target) crates: bare cargo commands cover exactly this
# set. The wasm-only components build for their target through the
# justfile recipes.
default-members = ["core", "host-wasmtime"]
# experiments/udp-wake is its own workspace: it builds with its own
# RUSTFLAGS (`--cfg tokio_unstable`).
exclude = ["experiments/udp-wake"]

[workspace.package]
edition = "2021"
publish = false

# Sibling crates are consumed as git dependencies pinned at a commit, per
# the siblings' own release practice; bumped deliberately.
[workspace.dependencies]
polymorph-tls-profile = { git = "https://github.com/polymorph-components/polymorph-tls.git", rev = "ab4f88367b838f07a64ea64cfcfd5e03f494ea35" }
polymorph-tls-quic = { git = "https://github.com/polymorph-components/polymorph-tls.git", rev = "ab4f88367b838f07a64ea64cfcfd5e03f494ea35" }
polymorph-webcrypto-guest = { git = "https://github.com/polymorph-components/polymorph-webcrypto.git", rev = "44325359175b0f1671ae4c94a06c0c8936f98dfd" }
polymorph-webcrypto-wasmtime = { git = "https://github.com/polymorph-components/polymorph-webcrypto.git", rev = "44325359175b0f1671ae4c94a06c0c8936f98dfd" }
wasmtime-webrtc-datachannels = { git = "https://github.com/polymorph-components/polymorph-webrtc-datachannels.git", rev = "fe05ecfd239916225c216d920ff526ba7af4fcac" }
wasmtime-websocket = { git = "https://github.com/polymorph-components/polymorph-websocket.git", rev = "ec3ffa27d7377f6a9939fb75c0d6ccdeb29cfa7b" }

[profile.release]
lto = true
opt-level = "s"

# The native host binaries (test harnesses, not shipped artifacts).
# Fat LTO buys real size on the guest components but only link time
# here, and the hosts relink on every gate run that touches anything
# beneath them. Thin LTO parallelizes the links.
[profile.host]
inherits = "release"
lto = "thin"
