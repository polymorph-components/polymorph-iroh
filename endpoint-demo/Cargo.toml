[package]
name = "iroh-endpoint-demo"
version = "0.0.1"
edition.workspace = true
publish.workspace = true
description = "Endpoint demo consumer: one echo exchange driven through the polymorph:iroh surface"

[lib]
crate-type = ["cdylib"]

[dependencies]
wit-bindgen = { version = "0.59", features = ["async"] }
futures = { version = "0.3", default-features = false, features = ["async-await", "std"] }
hex = "0.4"
polymorph-webcrypto-guest = { path = "../.deps/webcrypto/rust/guest" }
